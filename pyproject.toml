[project]
name = "animal-shelter-analysis"
version = "0.1.0"
description = "Animal shelter outcome prediction, adoption-delay associations, and stray-dog reunification"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pandas>=2.2.0",
    "numpy>=2.0.0",
    "requests>=2.32.0",
    "statsmodels>=0.14.0",
    "matplotlib>=3.10.0",
    "seaborn>=0.13.2",
    "plotnine>=0.15.0",
    "geopandas>=1.1.0",
    "altair>=5.5.0",
    "scikit-learn==1.9.0",
    "scipy>=1.18.0",
    "joblib>=1.5.3",
    "streamlit==1.62.0",
]
